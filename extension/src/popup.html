<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: Arial, sans-serif; width: 240px; padding: 12px; }
      .row { margin: 8px 0; }
      button { width: 100%; padding: 8px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
      button.on { background: #2ecc71; color: #fff; border-color: #27ae60; }
      label { font-size: 13px; }
      select { width: 100%; padding: 6px; }
      .small { font-size: 12px; color: #555; }
    </style>
  </head>
  <body>
    <div class="row">
      <button id="toggle" class="on">Enabled</button>
    </div>

    <div class="row">
      <label for="speed">Move speed (ms):</label>
      <select id="speed">
        <option value="80">80</option>
        <option value="150" selected>150</option>
        <option value="250">250</option>
        <option value="500">500</option>
      </select>
      <div class="small">Best-effort. “1 microsecond” isn’t possible in-browser.</div>
    </div>

    <div class="row">
      <div class="small">Bot runs locally via your Stockfish exe.</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
